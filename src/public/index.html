<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetailOps - Action Console</title>
  <meta name="description" content="Autonomous retail intelligence: three-panel action console.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            phosphor: {
              DEFAULT: '#00ff66',
              dim: 'rgba(0, 255, 102, 0.1)',
              glow: 'rgba(0, 255, 102, 0.2)',
              hover: '#33ff85',
            },
            slate: {
              950: '#080b11', /* main canvas background */
              900: '#0e121e', /* card background */
              850: '#141a29', /* card hover / secondary */
              800: '#1a2134', /* inputs / borders */
              700: '#212b40',
            }
          },
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            mono: ['DM Mono', 'monospace'],
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #080b11;
      color: #94a3b8;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #080b11; }
    ::-webkit-scrollbar-thumb { background: #1a2134; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ff66; }
  </style>
</head>
<body class="font-sans antialiased text-slate-400">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* Inline SVGs for Sequence aesthetics */
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        sync: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H18.5" />
          </svg>
        ),
        trash: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        ),
        settings: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        ),
        terminal: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        ),
        check: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
            <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        ),
        ban: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
        ),
        undo: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
          </svg>
        ),
        play: (
          <svg className={className} fill="currentColor" viewBox="0 0 24 24">
            <polygon points="5,3 19,12 5,21" />
          </svg>
        ),
        info: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        spinner: (
          <svg className={`${className} animate-spin`} fill="none" viewBox="0 0 24 24">
            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
          </svg>
        ),
        grid: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
        ),
        activity: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        ),
        user: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        ),
        chevronRight: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        ),
        bell: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        )
      };
      return icons[name] || null;
    };

    function App() {
      // States
      const [feed, setFeed] = useState([]);
      const [reviewQueue, setReviewQueue] = useState([]);
      const [ledger, setLedger] = useState([]);
      const [undoWindow, setUndoWindow] = useState(15);
      const [wsConnected, setWsConnected] = useState(false);
      const [activeTab, setActiveTab] = useState('Overview');
      
      // Analysis pipeline simulation / trigger states
      const [productInput, setProductInput] = useState('');
      const [daysAhead, setDaysAhead] = useState(30);
      const [loading, setLoading] = useState(false);
      const [statusStep, setStatusStep] = useState(0);
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const wsRef = useRef(null);
      const reconnectTimerRef = useRef(null);

      // WebSocket URL builder
      const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + (window.location.host || 'localhost:3001');

      // Colors mapping for different agent logs
      const agentColors = {
        daemon: 'text-slate-400 border-slate-800 bg-slate-900/40',
        auditor: 'text-cyan-400 border-cyan-950/50 bg-cyan-950/10',
        scorer: 'text-purple-400 border-purple-950/50 bg-purple-950/10',
        procurement: 'text-yellow-400 border-yellow-950/50 bg-yellow-950/10',
        pricing: 'text-emerald-400 border-emerald-950/50 bg-emerald-950/10',
        recovery: 'text-red-400 border-red-950/50 bg-red-950/10',
        ledger: 'text-blue-400 border-blue-950/50 bg-blue-950/10'
      };

      // Formatter for action payload strings
      const formatLog = (log) => {
        if (log.message) return log.message;
        const details = log.payload ? (typeof log.payload === 'string' ? JSON.parse(log.payload) : log.payload) : {};
        let msg = `${log.actionType.toUpperCase()}: `;
        if (log.actionType === 'data_clean') {
          msg += `Cleaned ${details.cleaned || 0} rows, flagged ${details.flagged || 0}, fixed ${details.anomaliesFixed || 0} anomalies`;
        } else if (log.actionType === 'purchase_order') {
          msg += `PO created for ${details.productName || 'unknown'}: ${details.qty || 0} units | Status: ${details.status || 'unknown'}`;
        } else if (log.actionType === 'price_update') {
          msg += `${details.productName || 'unknown'}: Rs.${details.oldPrice} -> Rs.${Number(details.newPrice).toFixed(0)} (${details.status || 'applied'})`;
        } else {
          msg += JSON.stringify(details);
        }
        return msg;
      };

      // API fetch functions
      const loadReviewQueue = async () => {
        try {
          const res = await fetch('/api/review-queue');
          const data = await res.json();
          setReviewQueue(data);
        } catch (e) {
          console.error('Failed to load review queue:', e);
        }
      };

      const loadLedger = async () => {
        try {
          const res = await fetch('/api/ledger');
          const data = await res.json();
          setLedger(data);
        } catch (e) {
          console.error('Failed to load ledger:', e);
        }
      };

      const loadConfig = async () => {
        try {
          const res = await fetch('/api/agent-config');
          const data = await res.json();
          if (data.undo_window_minutes) {
            setUndoWindow(Number(data.undo_window_minutes));
          }
        } catch (e) {
          console.error('Failed to load config:', e);
        }
      };

      const saveConfig = async (val) => {
        setUndoWindow(val);
        try {
          await fetch('/api/agent-config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: 'undo_window_minutes', value: String(val) })
          });
        } catch (e) {
          console.error('Failed to save config:', e);
        }
      };

      // WebSocket Connection
      const connectWS = useCallback(() => {
        if (wsRef.current) {
          wsRef.current.close();
        }

        console.error('[WS] Connecting to:', wsUrl);
        const ws = new WebSocket(wsUrl);
        wsRef.current = ws;

        ws.onopen = () => {
          console.error('[WS] Connected successfully');
          setWsConnected(true);
        };

        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'agent_event') {
              const ev = msg.data;
              setFeed(prev => [ev, ...prev].slice(0, 100));
            } else if (msg.type === 'replay') {
              const logs = msg.data;
              const events = logs.map(l => ({
                id: l.id,
                agentId: l.agentId,
                level: l.outcome === 'failed' ? 'error' : 'info',
                message: formatLog(l),
                ts: l.createdAt
              }));
              setFeed(events.reverse());
            } else if (msg.type === 'review_ack') {
              const { id } = msg.data;
              setReviewQueue(prev => prev.filter(item => item.id !== id));
              loadLedger();
            } else if (msg.type === 'undo_ack') {
              const { id } = msg.data;
              setLedger(prev => prev.map(item => item.id === id ? { ...item, outcome: 'undone' } : item));
            }
          } catch (err) {
            console.error('[WS] Message parsing error:', err);
          }
        };

        ws.onclose = () => {
          console.error('[WS] Disconnected');
          setWsConnected(false);
          if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
          reconnectTimerRef.current = setTimeout(() => {
            connectWS();
          }, 3000);
        };

        ws.onerror = (err) => {
          console.error('[WS] Error:', err);
          ws.close();
        };
      }, [wsUrl]);

      // Actions
      const handleReviewAction = (id, action) => {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({ type: 'review_action', id, action: action === 'approve' ? 'approved' : 'rejected' }));
        } else {
          // REST Fallback
          console.error('[WS] WS inactive, fallback to REST post');
          fetch(`/api/review/${id}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: action === 'approve' ? 'approved' : 'rejected' })
          })
          .then(res => res.json())
          .then(() => {
            setReviewQueue(prev => prev.filter(item => item.id !== id));
            loadLedger();
          })
          .catch(e => console.error('[REST] Review action fallback error:', e));
        }
      };

      const handleUndoLedger = async (id) => {
        try {
          const res = await fetch(`/api/ledger/${id}/undo`, { method: 'POST' });
          const data = await res.json();
          if (data.success) {
            setLedger(prev => prev.map(item => item.id === id ? { ...item, outcome: 'undone' } : item));
            setSuccessMsg('Ledger action successfully rolled back.');
            setTimeout(() => setSuccessMsg(''), 4000);
          } else {
            setErrorMsg(data.error || 'Failed to rollback ledger action.');
            setTimeout(() => setErrorMsg(''), 4000);
          }
        } catch (e) {
          console.error('Ledger undo error:', e);
          setErrorMsg('Failed to trigger undo action.');
          setTimeout(() => setErrorMsg(''), 4000);
        }
      };

      // Trigger standard RetailOps analysis workflow
      const triggerWorkflow = async (searchQuery) => {
        const query = searchQuery || productInput;
        if (!query.trim()) {
          setErrorMsg('Enter a query or click a preset.');
          return;
        }

        setErrorMsg('');
        setSuccessMsg('');
        setLoading(true);
        setStatusStep(1);

        const t1 = setTimeout(() => setStatusStep(2), 1200);
        const t2 = setTimeout(() => setStatusStep(3), 2400);
        const t3 = setTimeout(() => setStatusStep(4), 3600);

        try {
          const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_name: query, days_ahead: daysAhead })
          });
          const data = await res.json();
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
          setStatusStep(5);

          if (data.errors && data.errors.length > 0 && data.status !== 'completed') {
            setErrorMsg(`Workflow issue: ${data.errors.join('; ')}`);
          } else {
            loadLedger();
            loadReviewQueue();
          }
        } catch (e) {
          setErrorMsg(`Workflow trigger error: ${e.message}`);
        } finally {
          setLoading(false);
          setTimeout(() => setStatusStep(0), 2500);
        }
      };

      const clearLogCache = async () => {
        if (!confirm('Clear all cached analysis runs? This is irreversible.')) return;
        try {
          await fetch('/api/runs', { method: 'DELETE' });
          setSuccessMsg('All analysis logs cleared.');
          loadLedger();
        } catch (e) {
          setErrorMsg('Failed to clear logs.');
        }
      };

      // Calculate total PO value for metrics card
      const totalPoValue = ledger
        .filter(l => l.actionType === 'purchase_order' && l.outcome !== 'undone')
        .reduce((sum, item) => {
          try {
            const p = typeof item.payload === 'string' ? JSON.parse(item.payload) : item.payload;
            return sum + (p.qty * (p.costPerUnit || 1200));
          } catch(e) { return sum; }
        }, 0);

      // Lifecycle hooks
      useEffect(() => {
        connectWS();
        loadReviewQueue();
        loadLedger();
        loadConfig();

        return () => {
          if (wsRef.current) wsRef.current.close();
          if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
        };
      }, [connectWS]);

      return (
        <div className="min-h-screen bg-slate-950 flex font-sans select-none text-slate-400">
          
          {/* LEFT SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between shrink-0">
            <div className="flex flex-col">
              {/* Brand Logo */}
              <div className="px-6 py-6 border-b border-slate-800 flex items-center space-x-3">
                <div className="relative w-8 h-8 rounded-lg bg-gradient-to-tr from-phosphor to-cyan-400 p-0.5 flex items-center justify-center">
                  <div className="w-full h-full bg-slate-950 rounded-[7px] flex items-center justify-center font-bold text-white text-sm">
                    S
                  </div>
                </div>
                <div>
                  <h1 className="font-display font-bold text-sm tracking-tight text-white leading-none">Sequence</h1>
                  <span className="text-[10px] font-mono text-slate-500 uppercase tracking-wider">RetailOps Client</span>
                </div>
              </div>

              {/* Main Navigation Stack */}
              <nav className="p-4 space-y-1">
                {[
                  { name: 'Overview', icon: 'grid' },
                  { name: 'Review Queue', icon: 'info', count: reviewQueue.length },
                  { name: 'Activity Feed', icon: 'activity' },
                  { name: 'Action Ledger', icon: 'terminal', count: ledger.length },
                  { name: 'Settings', icon: 'settings' }
                ].map((tab) => {
                  const isActive = activeTab === tab.name;
                  return (
                    <button
                      key={tab.name}
                      onClick={() => setActiveTab(tab.name)}
                      className={`w-full flex items-center justify-between px-4 py-3 rounded-lg text-xs font-medium transition duration-200 group relative ${
                        isActive
                          ? 'text-white bg-slate-900/60 font-semibold border-l-2 border-phosphor pl-[14px]'
                          : 'text-slate-500 hover:text-slate-200 hover:bg-slate-900/30'
                      }`}
                    >
                      <div className="flex items-center space-x-3">
                        <Icon name={tab.icon} className={`w-4 h-4 ${isActive ? 'text-phosphor' : 'text-slate-500 group-hover:text-slate-300'}`} />
                        <span>{tab.name}</span>
                      </div>
                      {tab.count !== undefined && tab.count > 0 && (
                        <span className={`px-2 py-0.5 text-[9px] font-mono rounded ${isActive ? 'bg-phosphor/20 text-phosphor' : 'bg-slate-900 text-slate-400'}`}>
                          {tab.count}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* User Info Foot */}
            <div className="p-4 border-t border-slate-800">
              <div className="flex items-center space-x-3 p-2 bg-slate-900/30 rounded-lg">
                <div className="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300">
                  <Icon name="user" className="w-4 h-4 text-slate-400" />
                </div>
                <div className="overflow-hidden">
                  <p className="text-xs font-semibold text-white truncate leading-tight">Retail Operator</p>
                  <span className="text-[10px] text-slate-500 font-mono">System Active</span>
                </div>
              </div>
            </div>
          </aside>

          {/* MAIN CANVAS BODY */}
          <main className="flex-1 flex flex-col min-w-0 bg-slate-950 overflow-y-auto">
            
            {/* TOP BAR HEADER */}
            <header className="h-16 border-b border-slate-800 px-8 flex items-center justify-between shrink-0 bg-slate-950/60 backdrop-blur-md sticky top-0 z-30">
              <div className="flex items-center space-x-4">
                <h2 className="font-display font-semibold text-base text-white">{activeTab}</h2>
                <div className="h-4 w-px bg-slate-800 hidden sm:block"></div>
                <p className="text-xs text-slate-500 font-mono hidden sm:block">
                  Current Loop Status: &nbsp;
                  <span className="text-slate-300 font-medium">Auto Cycle running</span>
                </p>
              </div>

              {/* Status beacon and triggers */}
              <div className="flex items-center space-x-4">
                <div className="flex items-center space-x-2 bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-full">
                  <span className="relative flex h-2 w-2">
                    <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${wsConnected ? 'bg-phosphor' : 'bg-amber-500'}`}></span>
                    <span className={`relative inline-flex rounded-full h-2 w-2 ${wsConnected ? 'bg-phosphor' : 'bg-amber-600'}`}></span>
                  </span>
                  <span className="text-[10px] font-mono text-slate-300 font-medium uppercase tracking-wider">
                    {wsConnected ? 'Connected' : 'Offline'}
                  </span>
                </div>

                <button onClick={() => { loadLedger(); loadReviewQueue(); }} className="p-2 text-slate-500 hover:text-white bg-slate-900/50 border border-slate-800 hover:border-slate-700 rounded-lg transition" title="Sync Status">
                  <Icon name="sync" className="w-3.5 h-3.5" />
                </button>

                <button onClick={clearLogCache} className="p-2 text-red-400 hover:text-red-300 bg-red-950/10 border border-red-900/20 hover:border-red-900/40 rounded-lg transition" title="Flush Activity DB">
                  <Icon name="trash" className="w-3.5 h-3.5" />
                </button>
              </div>
            </header>

            {/* WRAPPER FOR CHOSEN TAB VIEW */}
            <div className="flex-1 p-8 space-y-6">
              
              {/* TOP LEVEL FINANCIAL & SYSTEM KPI METRICS GRID */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-6">

                        );
                      })
                    )}
                  </div>
                </div>
              )}

              {/* ACTION LEDGER TIMELINE (Panel C View) */}
              {activeTab === 'Action Ledger' && (
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-6">
                    <h4 className="font-display font-semibold text-sm text-white uppercase tracking-wider">Operation Ledger Timeline</h4>
                    <span className="text-xs font-mono px-3 py-1 rounded bg-slate-950 border border-slate-850 text-slate-400">{ledger.length} total events recorded</span>
                  </div>

                  <div className="space-y-4">
                    {ledger.length === 0 ? (
                      <div className="text-slate-500 h-64 flex flex-col items-center justify-center border border-dashed border-slate-800 rounded-xl text-center p-6 text-xs font-mono">
                        No transactions recorded. Run a pipeline cycle to initialize the ledger.
                      </div>
                    ) : (
                      ledger.map((item) => {
                        const isUndone = item.outcome === 'undone';
                        return (
                          <div key={item.id} className={`bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:border-slate-700 transition ${isUndone ? 'opacity-40' : ''}`}>
                            <div className="flex items-center space-x-4">
                              <span className="text-[10px] font-mono px-2 py-1 rounded font-bold uppercase bg-slate-900 border border-slate-800 text-slate-300">
                                {item.agentId}
                              </span>
                              <div>
                                <span className="text-[10px] font-mono text-slate-500 uppercase tracking-wider block font-semibold">{item.actionType}</span>
                                <p className="text-sm text-slate-200 mt-0.5">{formatLog(item)}</p>
                              </div>
                            </div>

                            <div className="flex items-center justify-between md:justify-end gap-6 text-xs font-mono">
                              <div className="text-right">
                                <span className="text-[10px] text-slate-500 block leading-none">Timestamp</span>
                                <span className="text-slate-300">{new Date(item.createdAt).toLocaleString()}</span>
                              </div>

                              <div className="flex items-center space-x-3">
                                <span className={`px-2.5 py-0.5 text-[9px] font-bold rounded uppercase ${isUndone ? 'bg-slate-800 text-slate-500' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}`}>
                                  {item.outcome}
                                </span>
                                {!isUndone && (item.actionType === 'price_update' || item.actionType === 'purchase_order') && (
                                  <button
                                    onClick={() => handleUndoLedger(item.id)}
                                    className="text-red-400 hover:text-red-300 border border-red-950/20 hover:border-red-900/40 bg-red-950/10 px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5"
                                  >
                                    <Icon name="undo" className="w-3.5 h-3.5" />
                                    <span>UNDO ACTION</span>
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              )}

              {/* ACTIVITY FEED TAB VIEW (Panel A View) */}
              {activeTab === 'Activity Feed' && (
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-6">
                    <h4 className="font-display font-semibold text-sm text-white uppercase tracking-wider">Agent Activity Stream (WebSocket logs)</h4>
                    <span className="text-xs font-mono px-3 py-1 rounded bg-slate-950 border border-slate-850 text-slate-400">{feed.length} messages buffered</span>
                  </div>

                  <div className="space-y-2 font-mono text-xs max-h-[600px] overflow-y-auto pr-2">
                    {feed.length === 0 ? (
                      <div className="text-slate-600 h-64 flex items-center justify-center border border-dashed border-slate-800 rounded-xl text-center p-6">
                        No WS activity received. Trigger run to initialize streams.
                      </div>
                    ) : (
                      feed.map((ev, index) => {
                        const colorClass = agentColors[ev.agentId] || 'text-slate-300 border-slate-800 bg-slate-950/20';
                        return (
                          <div key={ev.id || index} className={`p-3 rounded-lg border ${colorClass} transition hover:bg-slate-850/20`}>
                            <div className="flex justify-between items-center text-[10px] opacity-75 mb-2 border-b border-slate-900/30 pb-1.5">
                              <span className="font-bold uppercase tracking-wider">{ev.agentId}</span>
                              <span>{new Date(ev.ts || Date.now()).toLocaleString()}</span>
                            </div>
                            <div className="text-slate-200 font-sans leading-relaxed">{ev.message}</div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              )}

              {/* SETTINGS PANEL */}
              {activeTab === 'Settings' && (
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-xl">
                  <div className="flex items-center space-x-2 text-slate-300 border-b border-slate-800 pb-3 mb-6">
                    <Icon name="settings" className="w-5 h-5 text-phosphor" />
                    <h4 className="font-display font-semibold text-sm text-white uppercase tracking-wider">Dashboard Settings</h4>
                  </div>

                  <div className="space-y-6">
                    <div className="space-y-3">
                      <div className="flex justify-between items-center">
                        <label className="text-xs font-semibold text-white uppercase">Undo Grace Period</label>
                        <span className="text-xs font-mono text-phosphor font-bold">{undoWindow} minutes</span>
                      </div>
                      <p className="text-xs text-slate-500">Configure how long prices and purchase orders can be reversed from the Action Ledger before database lock.</p>
                      
                      <div className="pt-2">
                        <input
                          type="range"
                          min="1"
                          max="30"
                          value={undoWindow}
                          onChange={(e) => saveConfig(Number(e.target.value))}
                          className="w-full accent-phosphor h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                        />
                        <div className="flex justify-between text-[10px] font-mono text-slate-500 mt-1">
                          <span>1m</span>
                          <span>15m</span>
                          <span>30m</span>
                        </div>
                      </div>
                    </div>

                    <div className="pt-6 border-t border-slate-800 space-y-4">
                      <h5 className="text-xs font-semibold text-white uppercase">Network configurations</h5>
                      <div className="space-y-2 text-xs font-mono">
                        <div className="flex justify-between py-1 border-b border-slate-950">
                          <span className="text-slate-500">API Endpoint</span>
                          <span className="text-slate-300">http://localhost:3001</span>
                        </div>
                        <div className="flex justify-between py-1">
                          <span className="text-slate-500">WebSocket Endpoint</span>
                          <span className="text-slate-300">{wsUrl}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* User notification status bar */}
          {(errorMsg || successMsg) && (
            <div className="fixed bottom-6 right-6 z-50 animate-bounce">
              {errorMsg && (
                <div className="bg-red-950 border border-red-800 text-red-200 px-4 py-3 rounded-lg flex items-center space-x-2 shadow-2xl text-xs font-mono">
                  <Icon name="ban" className="text-red-400" />
                  <span>{errorMsg}</span>
                </div>
              )}
              {successMsg && (
                <div className="bg-emerald-950 border border-emerald-800 text-emerald-200 px-4 py-3 rounded-lg flex items-center space-x-2 shadow-2xl text-xs font-mono">
                  <Icon name="check" className="text-emerald-400" />
                  <span>{successMsg}</span>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
