<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetailOps - Autonomous Retail Intelligence</title>
  <meta name="description" content="Autonomous demand forecasting, inventory replenishment, and dynamic pricing orchestration for modern retail operations.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Design Tokens -->
  <link rel="stylesheet" href="/tokens.css">

  <style>
    /* ─── Hallmark · macrostructure: Workbench · tone: utilitarian-technical · anchor hue: phosphor-green ─── */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      overflow-x: clip;
      height: 100%;
    }

    body {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--color-ink);
      background-color: var(--color-paper);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── App Shell: Workbench Layout ─── */
    .workbench {
      display: grid;
      grid-template-rows: 48px 1fr;
      grid-template-columns: 280px 1fr;
      grid-template-areas:
        "topbar topbar"
        "rail   main";
      min-height: 100vh;
    }

    /* ─── Top Command Bar ─── */
    .topbar {
      grid-area: topbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-6);
      background: var(--color-paper-2);
      border-bottom: 1px solid var(--color-rule);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .topbar-wordmark {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.01em;
    }

    .topbar-dot {
      width: 6px;
      height: 6px;
      border-radius: var(--radius-full);
      background: var(--color-accent);
      box-shadow: 0 0 8px var(--color-accent);
      flex-shrink: 0;
    }

    .topbar-status {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      color: var(--color-ink-3);
    }

    .status-live {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      color: var(--color-accent);
    }

    .status-live::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: var(--radius-full);
      background: var(--color-accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    /* ─── Left Control Rail ─── */
    .rail {
      grid-area: rail;
      background: var(--color-paper-2);
      border-right: 1px solid var(--color-rule);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: sticky;
      top: 48px;
      height: calc(100vh - 48px);
    }

    .rail-section {
      padding: var(--space-5) var(--space-5) var(--space-4);
      border-bottom: 1px solid var(--color-rule);
    }

    .rail-label {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink-4);
      margin-bottom: var(--space-3);
    }

    /* ─── Main Workspace ─── */
    .main {
      grid-area: main;
      overflow-y: auto;
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* ─── Tokens ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background var(--dur-mid) var(--ease-out),
                  border-color var(--dur-mid) var(--ease-out),
                  color var(--dur-mid) var(--ease-out),
                  transform var(--dur-fast) var(--ease-out);
      border: 1px solid transparent;
      padding: var(--space-2) var(--space-4);
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--color-accent);
      color: var(--color-paper);
      border-color: var(--color-accent);
    }

    .btn-primary:hover {
      background: oklch(80% 0.20 145);
      border-color: oklch(80% 0.20 145);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--color-ink-3);
      border-color: var(--color-rule);
    }

    .btn-ghost:hover {
      background: var(--color-paper-3);
      color: var(--color-ink-2);
      border-color: oklch(100% 0 0 / 0.12);
    }

    .btn-danger {
      background: transparent;
      color: var(--color-signal-hi);
      border-color: oklch(65% 0.19 25 / 0.25);
    }

    .btn-danger:hover {
      background: var(--color-signal-hi-bg);
    }

    .btn-full {
      width: 100%;
      justify-content: center;
      padding: var(--space-3) var(--space-4);
    }

    /* ─── Input ─── */
    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .field-label {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-ink-3);
    }

    .input {
      width: 100%;
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-3);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      transition: border-color var(--dur-mid) var(--ease-out);
    }

    .input::placeholder {
      color: var(--color-ink-4);
    }

    .input:focus {
      outline: none;
      border-color: var(--color-accent);
    }

    .input:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 1px;
    }

    .input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ─── Range slider ─── */
    .range {
      width: 100%;
      accent-color: var(--color-accent);
      cursor: pointer;
      height: 2px;
      border-radius: var(--radius-full);
    }

    .range-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }

    .range-value {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--color-accent);
    }

    /* ─── Presets chip strip ─── */
    .preset-strip {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .preset-chip {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--color-paper-3);
      border: 1px solid var(--color-rule);
      color: var(--color-ink-3);
      cursor: pointer;
      transition: background var(--dur-mid) var(--ease-out),
                  color var(--dur-mid) var(--ease-out),
                  border-color var(--dur-mid) var(--ease-out);
      white-space: nowrap;
    }

    .preset-chip:hover {
      background: var(--color-accent-dim);
      border-color: var(--color-rule-accent);
      color: var(--color-accent);
    }

    .preset-chip:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .preset-chip:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    /* ─── Pipeline Steps ─── */
    .pipeline {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-lg);
    }

    .pipeline-title {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink-4);
      margin-bottom: var(--space-1);
    }

    .pipeline-step {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }

    .step-indicator {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 600;
      border: 1px solid var(--color-rule);
      background: var(--color-paper-3);
      color: var(--color-ink-4);
      transition: all var(--dur-mid) var(--ease-out);
      margin-top: 1px;
    }

    .step-indicator.active {
      background: var(--color-accent-dim);
      border-color: var(--color-rule-accent);
      color: var(--color-accent);
      animation: pulse-ring 1.5s ease-in-out infinite;
    }

    .step-indicator.done {
      background: var(--color-accent-dim);
      border-color: var(--color-rule-accent);
      color: var(--color-accent);
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 var(--color-accent-dim); }
      50% { box-shadow: 0 0 0 4px var(--color-accent-glow); }
    }

    .step-content {}

    .step-name {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-ink-3);
      transition: color var(--dur-mid) var(--ease-out);
    }

    .step-name.active { color: var(--color-ink); }
    .step-name.done { color: var(--color-ink-2); }

    .step-desc {
      font-size: var(--text-2xs);
      color: var(--color-ink-4);
      line-height: 1.4;
      margin-top: 2px;
      transition: color var(--dur-mid) var(--ease-out);
    }

    .step-desc.active { color: var(--color-ink-3); }

    /* ─── Metric Cards ─── */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
    }

    .metric-card {
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      transition: border-color var(--dur-mid) var(--ease-out),
                  background var(--dur-mid) var(--ease-out);
      cursor: default;
    }

    .metric-card:hover {
      border-color: oklch(100% 0 0 / 0.12);
      background: var(--color-paper-3);
    }

    .metric-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-label {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-ink-3);
    }

    .metric-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-sm);
    }

    .metric-icon.forecast {
      background: var(--color-blue-dim);
      color: var(--color-blue);
    }

    .metric-icon.reorder {
      background: var(--color-violet-dim);
      color: var(--color-violet);
    }

    .metric-icon.pricing {
      background: var(--color-accent-dim);
      color: var(--color-accent);
    }

    .metric-value {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .metric-value-unit {
      font-size: var(--text-sm);
      font-weight: 400;
      color: var(--color-ink-3);
      margin-left: var(--space-1);
    }

    .metric-meta {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding-top: var(--space-3);
      border-top: 1px solid var(--color-rule);
    }

    .metric-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-meta-key {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      color: var(--color-ink-4);
    }

    .metric-meta-val {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      color: var(--color-ink-2);
    }

    .metric-meta-val.positive { color: var(--color-accent); }
    .metric-meta-val.negative { color: var(--color-signal-hi); }
    .metric-meta-val.warning  { color: var(--color-signal-md); }

    /* ─── Badge ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 600;
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-hi {
      background: var(--color-signal-hi-bg);
      color: var(--color-signal-hi);
      border: 1px solid oklch(65% 0.19 25 / 0.2);
    }

    .badge-md {
      background: var(--color-signal-md-bg);
      color: var(--color-signal-md);
      border: 1px solid oklch(78% 0.16 70 / 0.2);
    }

    .badge-lo {
      background: var(--color-signal-lo-bg);
      color: var(--color-signal-lo);
      border: 1px solid oklch(74% 0.20 145 / 0.2);
    }

    .badge-neutral {
      background: var(--color-paper-3);
      color: var(--color-ink-3);
      border: 1px solid var(--color-rule);
    }

    .badge-ok {
      background: var(--color-accent-dim);
      color: var(--color-accent);
      border: 1px solid var(--color-rule-accent);
    }

    .badge-fail {
      background: var(--color-signal-hi-bg);
      color: var(--color-signal-hi);
      border: 1px solid oklch(65% 0.19 25 / 0.2);
    }

    /* ─── Analysis result panels ─── */
    .analysis-panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }

    .panel {
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink-4);
    }

    .narrative-block {
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-size: var(--text-xs);
      color: var(--color-ink-3);
      line-height: 1.6;
    }

    .narrative-section-label {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-ink-4);
      margin-bottom: var(--space-1);
    }

    /* ─── Chart ─── */
    .chart-wrap {
      height: 200px;
      width: 100%;
      position: relative;
    }

    .chart-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--color-rule);
      border-radius: var(--radius-lg);
      color: var(--color-ink-4);
      gap: var(--space-2);
      font-size: var(--text-xs);
    }

    .chart-empty-icon {
      font-size: var(--text-2xl);
      color: var(--color-ink-4);
      opacity: 0.4;
    }

    /* ─── Product ID card ─── */
    .product-card {
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .product-card-name {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .product-card-cat {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-accent);
      background: var(--color-accent-dim);
      border: 1px solid var(--color-rule-accent);
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
      display: inline-block;
      margin-bottom: var(--space-2);
    }

    .product-card-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .product-card-date {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      color: var(--color-ink-4);
    }

    .product-card-ref {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      color: var(--color-ink-3);
    }

    /* ─── Run Ledger Table ─── */
    .ledger-wrap {
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    .ledger-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--color-rule);
    }

    .ledger-title {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--color-ink);
    }

    .ledger-count {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      color: var(--color-accent);
      background: var(--color-accent-dim);
      border: 1px solid var(--color-rule-accent);
      padding: 2px var(--space-3);
      border-radius: var(--radius-full);
    }

    .ledger-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ledger-table th {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-ink-4);
      padding: var(--space-3) var(--space-4);
      text-align: left;
      border-bottom: 1px solid var(--color-rule);
      white-space: nowrap;
    }

    .ledger-table th.right { text-align: right; }
    .ledger-table th.center { text-align: center; }

    .ledger-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-rule);
      font-size: var(--text-xs);
      color: var(--color-ink-2);
      vertical-align: middle;
    }

    .ledger-table tr:last-child td {
      border-bottom: none;
    }

    .ledger-table tr {
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease-out);
    }

    .ledger-table tr:hover td {
      background: var(--color-paper-3);
    }

    .ledger-table tr.selected td {
      background: var(--color-accent-glow);
    }

    .ledger-table td.right {
      text-align: right;
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
    }

    .ledger-table td.center { text-align: center; }

    .ledger-product-name {
      font-weight: 600;
      color: var(--color-ink);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ledger-category {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-ink-4);
      margin-top: 2px;
    }

    .ledger-mono {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      color: var(--color-ink-2);
    }

    .ledger-date {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      color: var(--color-ink-4);
      white-space: nowrap;
    }

    /* ─── Load view button in ledger ─── */
    .btn-ledger {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      font-weight: 600;
      padding: 3px var(--space-3);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--dur-mid) var(--ease-out);
      border: 1px solid var(--color-rule);
      background: var(--color-paper-3);
      color: var(--color-ink-3);
      letter-spacing: 0.04em;
    }

    .btn-ledger:hover {
      border-color: var(--color-rule-accent);
      background: var(--color-accent-dim);
      color: var(--color-accent);
    }

    .btn-ledger.active {
      border-color: var(--color-rule-accent);
      background: var(--color-accent-dim);
      color: var(--color-accent);
    }

    .btn-ledger:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    /* ─── Empty / Placeholder states ─── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      padding: var(--space-16) var(--space-8);
      text-align: center;
      color: var(--color-ink-4);
    }

    .empty-glyph {
      width: 56px;
      height: 56px;
      border: 1px dashed var(--color-rule);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-2xl);
      color: var(--color-ink-4);
      opacity: 0.5;
    }

    .empty-heading {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--color-ink-3);
    }

    .empty-sub {
      font-size: var(--text-xs);
      color: var(--color-ink-4);
      max-width: 240px;
      line-height: 1.5;
    }

    /* ─── Alert banners ─── */
    .alert {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-lg);
      font-size: var(--text-xs);
      animation: slide-in var(--dur-slow) var(--ease-out);
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .alert-error {
      background: var(--color-signal-hi-bg);
      border: 1px solid oklch(65% 0.19 25 / 0.25);
      color: oklch(82% 0.10 25);
    }

    .alert-success {
      background: var(--color-signal-lo-bg);
      border: 1px solid oklch(74% 0.20 145 / 0.25);
      color: oklch(85% 0.10 145);
    }

    .alert-icon {
      font-size: var(--text-base);
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ─── Divider ─── */
    .divider {
      height: 1px;
      background: var(--color-rule);
    }

    /* ─── Section heading in main ─── */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .section-heading {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.01em;
    }

    .section-sub {
      font-size: var(--text-xs);
      color: var(--color-ink-4);
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--color-paper-2); }
    ::-webkit-scrollbar-thumb {
      background: var(--color-paper-5);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-accent-dim);
    }

    /* ─── Responsive ─── */
    @media (max-width: 768px) {
      .workbench {
        grid-template-columns: 1fr;
        grid-template-rows: 48px auto 1fr;
        grid-template-areas:
          "topbar"
          "rail"
          "main";
      }

      .rail {
        position: static;
        height: auto;
      }

      .metrics-row {
        grid-template-columns: 1fr;
      }

      .analysis-panels {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 414px) {
      .topbar-status { display: none; }
      .main { padding: var(--space-4); gap: var(--space-4); }
      .section-sub { display: none; }
    }

    /* ─── Fade-in animation for workspace results ─── */
    .fade-in {
      animation: fade-in var(--dur-slow) var(--ease-out);
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Number counter animation ─── */
    .counter { transition: opacity var(--dur-mid) var(--ease-out); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 150ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 150ms !important;
      }
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  /* ─────────────────────────────────────────────
     Helpers
  ───────────────────────────────────────────── */
  const normalizeRun = (run) => {
    if (!run) return null;
    // Raw client response
    if (run.forecast && run.forecast.final !== undefined) {
      return {
        id: run.id || 'live-run',
        timestamp: run.timestamp || new Date().toISOString(),
        productName: run.product_name || run.category || 'Unknown Product',
        category: run.category || 'general',
        status: run.status || 'completed',
        errors: run.errors && run.errors.length > 0 ? run.errors.join('; ') : null,
        forecast: {
          baseForecast: run.forecast.base || run.forecast.final || 0,
          finalForecast: run.forecast.final || 0,
          seasonalMultiplier: run.forecast.multiplier || 1.0,
          event: run.forecast.event || 'None',
          narrative: run.forecast.narrative || ''
        },
        replenishment: {
          reorderQty: run.replenishment.reorder_qty || 0,
          timing: run.replenishment.timing || 'unknown',
          risk: run.replenishment.risk || 'unknown',
          narrative: run.replenishment.narrative || ''
        },
        pricing: {
          recommendedPrice: run.pricing.recommended_price || 0,
          priceChangePct: run.pricing.change_pct || 0,
          strategy: run.pricing.strategy || 'maintain',
          narrative: run.pricing.narrative || ''
        }
      };
    }
    // DB record structure
    return {
      id: run.id,
      timestamp: run.timestamp,
      productName: run.productName || run.category || 'general',
      category: run.category,
      status: run.status,
      errors: run.errors,
      forecast: run.forecast ? {
        baseForecast: run.forecast.baseForecast,
        finalForecast: run.forecast.finalForecast,
        seasonalMultiplier: run.forecast.seasonalMultiplier,
        event: run.forecast.event,
        narrative: run.forecast.narrative
      } : null,
      replenishment: run.replenishment ? {
        reorderQty: run.replenishment.reorderQty,
        timing: run.replenishment.timing,
        risk: run.replenishment.risk || 'unknown',
        narrative: run.replenishment.narrative
      } : null,
      pricing: run.pricing ? {
        recommendedPrice: run.pricing.recommendedPrice,
        priceChangePct: run.pricing.priceChangePct,
        strategy: run.pricing.strategy,
        narrative: run.pricing.narrative
      } : null
    };
  };

  const formatDate = (iso) => {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' });
  };

  const riskBadgeClass = (risk) => {
    const r = String(risk).toLowerCase();
    if (r === 'high')   return 'badge badge-hi';
    if (r === 'medium') return 'badge badge-md';
    if (r === 'low')    return 'badge badge-lo';
    return 'badge badge-neutral';
  };

  /* ─────────────────────────────────────────────
     SVG Icons (inline, no icon CDN dependency)
  ───────────────────────────────────────────── */
  const Icon = ({ name, size = 16 }) => {
    const icons = {
      chart:   <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
      box:     <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
      tag:     <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>,
      play:    <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
      refresh: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
      trash:   <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
      check:   <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
      warn:    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
      ok:      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
      logo:    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>,
      spin:    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" style={{animation: 'spin 1s linear infinite', transformOrigin: 'center'}}/></svg>,
      search:  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
    };
    return icons[name] || null;
  };

  /* ─────────────────────────────────────────────
     Forecast Chart
  ───────────────────────────────────────────── */
  const ForecastChart = ({ selectedRun }) => {
    const canvasRef = useRef(null);
    const chartRef  = useRef(null);

    useEffect(() => {
      if (!canvasRef.current || !selectedRun || !selectedRun.forecast) {
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        return;
      }
      let pollId = null;
      const build = () => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        const ctx = canvasRef.current.getContext('2d');
        const f   = selectedRun.forecast;
        const r   = selectedRun.replenishment || {};
        chartRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Base Demand', 'Adj. Forecast', 'Reorder Qty'],
            datasets: [{
              label: 'Units',
              data: [f.baseForecast || 0, f.finalForecast || 0, r.reorderQty || 0],
              backgroundColor: [
                'oklch(68% 0.17 255 / 0.3)',
                'oklch(65% 0.19 300 / 0.5)',
                'oklch(74% 0.20 145 / 0.4)',
              ],
              borderColor: [
                'oklch(68% 0.17 255)',
                'oklch(65% 0.19 300)',
                'oklch(74% 0.20 145)',
              ],
              borderWidth: 1.5,
              borderRadius: 4,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'oklch(12% 0.014 252)',
                titleColor: 'oklch(94% 0.008 250)',
                bodyColor:  'oklch(52% 0.010 250)',
                borderColor: 'oklch(100% 0 0 / 0.07)',
                borderWidth: 1,
                padding: 10,
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: 'oklch(100% 0 0 / 0.05)' },
                ticks: {
                  color: 'oklch(36% 0.010 250)',
                  font: { family: 'DM Mono, monospace', size: 10 }
                }
              },
              x: {
                grid: { display: false },
                ticks: {
                  color: 'oklch(52% 0.010 250)',
                  font: { family: 'DM Mono, monospace', size: 10 }
                }
              }
            }
          }
        });
      };
      if (typeof Chart === 'undefined') {
        pollId = setInterval(() => { if (typeof Chart !== 'undefined') { clearInterval(pollId); build(); } }, 150);
      } else {
        build();
      }
      return () => {
        if (pollId) clearInterval(pollId);
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
      };
    }, [selectedRun]);

    const hasData = selectedRun && selectedRun.forecast;
    return (
      <div className="chart-wrap">
        {!hasData && (
          <div className="chart-empty">
            <span className="chart-empty-icon"><Icon name="chart" size={28}/></span>
            <span>Run an analysis to generate projections</span>
          </div>
        )}
        <div style={{ height: '100%', width: '100%', display: hasData ? 'block' : 'none' }}>
          <canvas ref={canvasRef}/>
        </div>
      </div>
    );
  };

  /* ─────────────────────────────────────────────
     Main App
  ───────────────────────────────────────────── */
  function App() {
    const [runs,         setRuns]         = useState([]);
    const [loading,      setLoading]      = useState(false);
    const [statusStep,   setStatusStep]   = useState(0);
    const [productInput, setProductInput] = useState('');
    const [daysAhead,    setDaysAhead]    = useState(30);
    const [selectedRun,  setSelectedRun]  = useState(null);
    const [error,        setError]        = useState('');
    const [success,      setSuccess]      = useState('');

    const presets = [
      { name: 'Smart TV',      query: 'Sony 65-inch Bravia OLED 4K Smart TV' },
      { name: 'Pro Laptop',    query: 'Apple MacBook Pro 16 M3 Max Slate' },
      { name: 'Groceries',     query: 'Fresh Organic Pink Lady Apples' },
      { name: 'Winter Coat',   query: 'Designer Waterproof Wool Trench Coat' },
      { name: 'Headphones',    query: 'Bose QuietComfort Wireless Headphones' },
    ];

    const pipelineSteps = [
      { step: 1, label: 'Catalog Enricher',   desc: 'Maps raw query to product category' },
      { step: 2, label: 'Demand Forecasting', desc: 'Seasonal adjustments + event surges' },
      { step: 3, label: 'Replenishment',      desc: 'Safety stock + MOQ + stockout risk' },
      { step: 4, label: 'Pricing Strategy',   desc: 'Dynamic price + margin optimisation' },
    ];

    const loadRuns = useCallback(async () => {
      try {
        const res  = await fetch('/api/runs');
        const data = await res.json();
        setRuns(data);
        if (data.length > 0 && !selectedRun) setSelectedRun(normalizeRun(data[0]));
      } catch (e) {
        console.error('Failed to load runs:', e);
      }
    }, []);

    useEffect(() => { loadRuns(); }, []);

    const runAnalysis = async (searchQuery) => {
      const query = searchQuery || productInput;
      if (!query.trim()) { setError('Enter a product name or select a preset.'); return; }

      setError(''); setSuccess('');
      setLoading(true); setStatusStep(1);

      const t1 = setTimeout(() => setStatusStep(2), 1500);
      const t2 = setTimeout(() => setStatusStep(3), 3000);
      const t3 = setTimeout(() => setStatusStep(4), 4500);

      try {
        const res  = await fetch('/api/analyze', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ product_name: query, days_ahead: daysAhead })
        });
        const data = await res.json();
        clearTimeout(t1); clearTimeout(t2); clearTimeout(t3);
        setStatusStep(5);

        if (data.errors && data.errors.length > 0 && data.status !== 'completed') {
          setError(`Workflow error: ${data.errors.join('; ')}`);
        } else {
          setSuccess(`Analysis complete for "${query}"`);
          const norm = normalizeRun(data);
          setSelectedRun(norm);
          loadRuns();
        }
      } catch (e) {
        setError(`Failed to trigger analysis: ${e.message}`);
      } finally {
        setLoading(false);
        setTimeout(() => setStatusStep(0), 2000);
      }
    };

    const clearAllRuns = async () => {
      if (!confirm('Clear all cached analysis runs? This cannot be undone.')) return;
      try {
        const res  = await fetch('/api/runs', { method: 'DELETE' });
        const data = await res.json();
        setRuns([]); setSelectedRun(null);
        setSuccess(data.message || 'Runs cleared.');
      } catch (e) {
        setError(`Failed to clear logs: ${e.message}`);
      }
    };

    const formatChangePct = (pct) => {
      if (pct == null) return '-';
      const sign = pct > 0 ? '+' : '';
      return `${sign}${pct.toFixed(1)}%`;
    };

    const changePctClass = (pct) => {
      if (pct > 0) return 'metric-meta-val positive';
      if (pct < 0) return 'metric-meta-val negative';
      return 'metric-meta-val';
    };

    return (
      <div className="workbench">

        {/* ─── Top Command Bar ─── */}
        <header className="topbar">
          <div className="topbar-brand">
            <div className="topbar-dot"></div>
            <span className="topbar-wordmark">RetailOps</span>
            <span style={{color: 'var(--color-ink-4)', fontSize: 'var(--text-2xs)'}}>
              Intelligence Suite
            </span>
          </div>

          <div className="topbar-status">
            <span className="status-live">LIVE</span>
            <span style={{margin: '0 4px', color: 'var(--color-rule)'}}>|</span>
            <span>MCP Workflow Engine</span>
            <span style={{margin: '0 4px', color: 'var(--color-rule)'}}>|</span>
            <span>{runs.length} runs cached</span>
          </div>

          <div className="topbar-actions">
            <button
              id="btn-refresh-runs"
              onClick={loadRuns}
              className="btn btn-ghost"
              title="Sync with database"
            >
              <Icon name="refresh" size={14}/> Sync
            </button>
            <button
              id="btn-clear-cache"
              onClick={clearAllRuns}
              className="btn btn-danger"
              title="Clear all cached runs"
            >
              <Icon name="trash" size={14}/> Clear
            </button>
          </div>
        </header>

        {/* ─── Left Control Rail ─── */}
        <aside className="rail">
          {/* Presets */}
          <div className="rail-section">
            <div className="rail-label">Quick Presets</div>
            <div className="preset-strip">
              {presets.map((p, i) => (
                <button
                  key={i}
                  id={`preset-${p.name.toLowerCase().replace(/\s+/g,'-')}`}
                  className="preset-chip"
                  disabled={loading}
                  onClick={() => { setProductInput(p.query); runAnalysis(p.query); }}
                >
                  {p.name}
                </button>
              ))}
            </div>
          </div>

          {/* Product query input */}
          <div className="rail-section">
            <div className="field">
              <label className="field-label" htmlFor="product-query">Product Query</label>
              <input
                id="product-query"
                className="input"
                type="text"
                value={productInput}
                onChange={(e) => setProductInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') runAnalysis(); }}
                placeholder="e.g. 65-inch 4K Smart TV OLED"
                disabled={loading}
              />
            </div>
          </div>

          {/* Days slider */}
          <div className="rail-section">
            <div className="field">
              <div className="range-row">
                <span className="field-label">Forecast Horizon</span>
                <span className="range-value">{daysAhead}d</span>
              </div>
              <input
                id="range-days"
                type="range"
                min="10" max="90" step="5"
                value={daysAhead}
                onChange={(e) => setDaysAhead(Number(e.target.value))}
                className="range"
                disabled={loading}
              />
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                marginTop: 'var(--space-1)',
                fontFamily: 'var(--font-mono)',
                fontSize: 'var(--text-2xs)',
                color: 'var(--color-ink-4)'
              }}>
                <span>10d</span><span>50d</span><span>90d</span>
              </div>
            </div>
          </div>

          {/* Run button */}
          <div className="rail-section">
            <button
              id="btn-run-analysis"
              onClick={() => runAnalysis()}
              disabled={loading || !productInput.trim()}
              className="btn btn-primary btn-full"
            >
              {loading ? (
                <><Icon name="spin" size={14}/> Running pipeline...</>
              ) : (
                <><Icon name="play" size={13}/> Run Analysis</>
              )}
            </button>
          </div>

          {/* Pipeline step monitor */}
          {(loading || statusStep === 5) && (
            <div className="rail-section">
              <div className="pipeline">
                <div className="pipeline-title">Pipeline Status</div>
                {pipelineSteps.map((node) => {
                  const isActive = statusStep === node.step;
                  const isDone   = statusStep > node.step;
                  return (
                    <div key={node.step} className="pipeline-step">
                      <div className={`step-indicator ${isActive ? 'active' : isDone ? 'done' : ''}`}>
                        {isDone ? <Icon name="check" size={9}/> : node.step}
                      </div>
                      <div className="step-content">
                        <div className={`step-name ${isActive ? 'active' : isDone ? 'done' : ''}`}>
                          {node.label}
                        </div>
                        <div className={`step-desc ${isActive ? 'active' : ''}`}>
                          {node.desc}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </aside>

        {/* ─── Main Workspace ─── */}
        <main className="main">

          {/* Alerts */}
          {error && (
            <div className="alert alert-error" role="alert">
              <span className="alert-icon"><Icon name="warn" size={16}/></span>
              <span>{error}</span>
            </div>
          )}
          {success && (
            <div className="alert alert-success" role="alert">
              <span className="alert-icon"><Icon name="ok" size={16}/></span>
              <span>{success}</span>
            </div>
          )}

          {/* Analysis Results */}
          {selectedRun ? (
            <div className="fade-in" key={selectedRun.id}>
              {/* Product identity card */}
              <div className="product-card" style={{marginBottom: 'var(--space-4)'}}>
                <div>
                  <span className="product-card-cat">{selectedRun.category}</span>
                  <div className="product-card-name">{selectedRun.productName}</div>
                </div>
                <div className="product-card-meta">
                  <div className="product-card-date">{formatDate(selectedRun.timestamp)}</div>
                  <div className="product-card-ref" style={{marginTop: 'var(--space-1)'}}>
                    ref: {String(selectedRun.id).substring(0, 8)}
                  </div>
                </div>
              </div>

              {/* Three metric cards */}
              <div className="metrics-row">
                {/* Forecast */}
                <div className="metric-card">
                  <div className="metric-card-header">
                    <span className="metric-label">Demand Forecast</span>
                    <span className="metric-icon forecast"><Icon name="chart" size={14}/></span>
                  </div>
                  <div className="metric-value counter">
                    {(selectedRun.forecast?.finalForecast || 0).toLocaleString()}
                    <span className="metric-value-unit">units</span>
                  </div>
                  <div className="metric-meta">
                    <div className="metric-meta-row">
                      <span className="metric-meta-key">Base demand</span>
                      <span className="metric-meta-val">
                        {(selectedRun.forecast?.baseForecast || 0).toLocaleString()}
                      </span>
                    </div>
                    <div className="metric-meta-row">
                      <span className="metric-meta-key">Seasonal mult.</span>
                      <span className="metric-meta-val positive">
                        {(selectedRun.forecast?.seasonalMultiplier || 1.0)}x
                      </span>
                    </div>
                    <div className="metric-meta-row">
                      <span className="metric-meta-key">Upcoming event</span>
                      <span className="metric-meta-val" style={{
                        maxWidth: '90px',
                        overflow: 'hidden',
                        textOverflow: 'ellipsis',
                        whiteSpace: 'nowrap'
                      }}>
                        {selectedRun.forecast?.event || 'None'}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Replenishment */}
                <div className="metric-card">
                  <div className="metric-card-header">
                    <span className="metric-label">Replenishment</span>
                    <span className="metric-icon reorder"><Icon name="box" size={14}/></span>
                  </div>
                  <div className="metric-value counter">
                    {(selectedRun.replenishment?.reorderQty || 0).toLocaleString()}
                    <span className="metric-value-unit">units</span>
                  </div>
                  <div className="metric-meta">
                    <div className="metric-meta-row">
                      <span className="metric-meta-key">Stockout risk</span>
                      <span className={riskBadgeClass(selectedRun.replenishment?.risk)}>
                        {String(selectedRun.replenishment?.risk || 'unknown').toUpperCase()}
                      </span>
                    </div>
                    <div className="metric-meta-row">
                      <span className="metric-meta-key">Reorder urgency</span>
                      <span className="metric-meta-val" style={{
                        maxWidth: '90px',
                        overflow: 'hidden',
                        textOverflow: 'ellipsis',
                        whiteSpace: 'nowrap'
                      }}>
                        {selectedRun.replenishment?.timing || 'unknown'}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Pricing */}
                <div className="metric-card">
                  <div className="metric-card-header">
                    <span className="metric-label">Pricing</span>
                    <span className="metric-icon pricing"><Icon name="tag" size={14}/></span>
                  </div>
                  <div className="metric-value counter">
                    <span style={{
                      fontFamily: 'var(--font-mono)',
                      fontSize: 'var(--text-lg)',
                      fontWeight: 400,
                      color: 'var(--color-ink-3)',
                      marginRight: '2px'
                    }}>&#8377;</span>
                    {(selectedRun.pricing?.recommendedPrice || 0).toLocaleString()}
                  </div>
                  <div className="metric-meta">
                    <div className="metric-meta-row">
                      <span className="metric-meta-key">Price delta</span>
                      <span className={changePctClass(selectedRun.pricing?.priceChangePct)}>
                        {formatChangePct(selectedRun.pricing?.priceChangePct)}
                      </span>
                    </div>
                    <div className="metric-meta-row">
                      <span className="metric-meta-key">Strategy</span>
                      <span className="metric-meta-val" style={{textTransform: 'capitalize'}}>
                        {selectedRun.pricing?.strategy || 'maintain'}
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Chart + Narratives */}
              <div className="analysis-panels">
                <div className="panel">
                  <div className="panel-title">Projection Chart</div>
                  <ForecastChart selectedRun={selectedRun}/>
                </div>

                <div className="panel" style={{overflowY: 'auto', maxHeight: '280px'}}>
                  <div className="panel-title">Analysis Narratives</div>
                  <div style={{display: 'flex', flexDirection: 'column', gap: 'var(--space-3)'}}>
                    {selectedRun.forecast?.narrative && (
                      <div>
                        <div className="narrative-section-label">Forecast</div>
                        <div className="narrative-block">{selectedRun.forecast.narrative}</div>
                      </div>
                    )}
                    {selectedRun.replenishment?.narrative && (
                      <div>
                        <div className="narrative-section-label">Replenishment</div>
                        <div className="narrative-block">{selectedRun.replenishment.narrative}</div>
                      </div>
                    )}
                    {selectedRun.pricing?.narrative && (
                      <div>
                        <div className="narrative-section-label">Pricing</div>
                        <div className="narrative-block">{selectedRun.pricing.narrative}</div>
                      </div>
                    )}
                    {!selectedRun.forecast?.narrative && !selectedRun.replenishment?.narrative && !selectedRun.pricing?.narrative && (
                      <div style={{
                        fontFamily: 'var(--font-mono)',
                        fontSize: 'var(--text-2xs)',
                        color: 'var(--color-ink-4)',
                        padding: 'var(--space-4)',
                        textAlign: 'center'
                      }}>
                        No narratives returned for this run.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="empty-state">
              <div className="empty-glyph"><Icon name="logo" size={28}/></div>
              <div className="empty-heading">No analysis selected</div>
              <div className="empty-sub">
                Select a preset or enter a product name in the left panel to run the pipeline.
              </div>
            </div>
          )}

          {/* Run Ledger Table */}
          <div className="ledger-wrap">
            <div className="ledger-header">
              <div>
                <div className="ledger-title">Analysis Ledger</div>
                <div style={{
                  fontFamily: 'var(--font-mono)',
                  fontSize: 'var(--text-2xs)',
                  color: 'var(--color-ink-4)',
                  marginTop: 'var(--space-1)'
                }}>
                  Cached workflow runs from local SQLite database
                </div>
              </div>
              <span className="ledger-count">{runs.length} runs</span>
            </div>

            <div style={{overflowX: 'auto'}}>
              <table className="ledger-table">
                <thead>
                  <tr>
                    <th>Product / Category</th>
                    <th>Timestamp</th>
                    <th>Status</th>
                    <th className="right">Forecast</th>
                    <th className="right">Reorder</th>
                    <th className="right">Price</th>
                    <th>Strategy</th>
                    <th className="center">View</th>
                  </tr>
                </thead>
                <tbody>
                  {runs.length === 0 ? (
                    <tr>
                      <td colSpan="8" style={{
                        padding: 'var(--space-12) var(--space-4)',
                        textAlign: 'center',
                        color: 'var(--color-ink-4)',
                        fontFamily: 'var(--font-mono)',
                        fontSize: 'var(--text-2xs)'
                      }}>
                        No runs cached yet. Trigger an analysis above to populate the ledger.
                      </td>
                    </tr>
                  ) : runs.map((run) => {
                    const norm       = normalizeRun(run);
                    const isSelected = selectedRun && selectedRun.id === run.id;
                    const status     = String(run.status || '').toLowerCase();
                    return (
                      <tr
                        key={run.id}
                        className={isSelected ? 'selected' : ''}
                        onClick={() => setSelectedRun(norm)}
                      >
                        <td>
                          <div className="ledger-product-name" title={norm.productName}>
                            {norm.productName}
                          </div>
                          <div className="ledger-category">{norm.category}</div>
                        </td>
                        <td className="ledger-date">{formatDate(run.timestamp)}</td>
                        <td>
                          {status === 'completed'
                            ? <span className="badge badge-ok"><Icon name="check" size={9}/> Done</span>
                            : status.startsWith('fail')
                            ? <span className="badge badge-fail"><Icon name="warn" size={9}/> Failed</span>
                            : <span className="badge badge-neutral">{run.status}</span>
                          }
                        </td>
                        <td className="right ledger-mono">
                          {run.forecast ? (run.forecast.finalForecast).toLocaleString() : '-'}
                        </td>
                        <td className="right ledger-mono">
                          {run.replenishment ? (run.replenishment.reorderQty).toLocaleString() : '-'}
                        </td>
                        <td className="right ledger-mono">
                          {run.pricing ? `\u20B9${(run.pricing.recommendedPrice).toLocaleString()}` : '-'}
                        </td>
                        <td>
                          <span className="ledger-mono" style={{textTransform: 'capitalize'}}>
                            {run.pricing ? run.pricing.strategy : '-'}
                          </span>
                        </td>
                        <td className="center" onClick={(e) => e.stopPropagation()}>
                          <button
                            id={`btn-view-${String(run.id).substring(0, 6)}`}
                            className={`btn-ledger${isSelected ? ' active' : ''}`}
                            onClick={() => setSelectedRun(norm)}
                          >
                            {isSelected ? 'Active' : 'View'}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App/>);
</script>

<!-- Hallmark · log entry written to .hallmark/log.json -->
</body>
</html>
