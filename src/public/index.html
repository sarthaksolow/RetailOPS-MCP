<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetailOps - Action Console</title>
  <meta name="description" content="Autonomous retail intelligence: three-panel action console.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            phosphor: {
              DEFAULT: '#00ff66',
              dim: 'rgba(0, 255, 102, 0.1)',
              glow: 'rgba(0, 255, 102, 0.2)',
              hover: '#33ff85',
            },
            slate: {
              950: '#070a13',
              900: '#0f1423',
              850: '#181e33',
              800: '#1f293d',
              700: '#374151',
            }
          },
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            mono: ['DM Mono', 'monospace'],
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #070a13;
      color: #cbd5e1;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f1423; }
    ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ff66; }
  </style>
</head>
<body class="font-sans antialiased text-slate-200">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* Inline SVGs to avoid loading extra assets */
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        sync: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H18.5" />
          </svg>
        ),
        trash: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        ),
        settings: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        ),
        terminal: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        ),
        check: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
            <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        ),
        ban: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
        ),
        undo: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
          </svg>
        ),
        play: (
          <svg className={className} fill="currentColor" viewBox="0 0 24 24">
            <polygon points="5,3 19,12 5,21" />
          </svg>
        ),
        info: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        spinner: (
          <svg className={`${className} animate-spin`} fill="none" viewBox="0 0 24 24">
            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
          </svg>
        )
      };
      return icons[name] || null;
    };

    function App() {
      // States
      const [feed, setFeed] = useState([]);
      const [reviewQueue, setReviewQueue] = useState([]);
      const [ledger, setLedger] = useState([]);
      const [undoWindow, setUndoWindow] = useState(15);
      const [wsConnected, setWsConnected] = useState(false);
      
      // Analysis pipeline simulation / trigger states
      const [runs, setRuns] = useState([]);
      const [productInput, setProductInput] = useState('');
      const [daysAhead, setDaysAhead] = useState(30);
      const [loading, setLoading] = useState(false);
      const [statusStep, setStatusStep] = useState(0);
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      const wsRef = useRef(null);
      const reconnectTimerRef = useRef(null);

      // WebSocket URL builder
      const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + (window.location.host || 'localhost:3000');

      // Colors mapping for different agent logs
      const agentColors = {
        daemon: 'text-slate-400 border-slate-700 bg-slate-900/50',
        auditor: 'text-blue-400 border-blue-900/50 bg-blue-950/20',
        scorer: 'text-purple-400 border-purple-900/50 bg-purple-950/20',
        procurement: 'text-yellow-400 border-yellow-900/50 bg-yellow-950/20',
        pricing: 'text-emerald-400 border-emerald-900/50 bg-emerald-950/20',
        recovery: 'text-red-400 border-red-900/50 bg-red-950/20',
        ledger: 'text-cyan-400 border-cyan-900/50 bg-cyan-950/20'
      };

      // Formatter for action payload strings
      const formatLog = (log) => {
        if (log.message) return log.message;
        const details = log.payload ? (typeof log.payload === 'string' ? JSON.parse(log.payload) : log.payload) : {};
        let msg = `${log.actionType.toUpperCase()}: `;
        if (log.actionType === 'data_clean') {
          msg += `Cleaned ${details.cleaned || 0} rows, flagged ${details.flagged || 0}, fixed ${details.anomaliesFixed || 0} anomalies`;
        } else if (log.actionType === 'purchase_order') {
          msg += `PO created for ${details.productName || 'unknown'}: ${details.qty || 0} units | Status: ${details.status || 'unknown'}`;
        } else if (log.actionType === 'price_update') {
          msg += `${details.productName || 'unknown'}: Rs.${details.oldPrice} -> Rs.${Number(details.newPrice).toFixed(0)} (${details.status || 'applied'})`;
        } else {
          msg += JSON.stringify(details);
        }
        return msg;
      };

      // API fetch functions
      const loadReviewQueue = async () => {
        try {
          const res = await fetch('/api/review-queue');
          const data = await res.json();
          setReviewQueue(data);
        } catch (e) {
          console.error('Failed to load review queue:', e);
        }
      };

      const loadLedger = async () => {
        try {
          const res = await fetch('/api/ledger');
          const data = await res.json();
          setLedger(data);
        } catch (e) {
          console.error('Failed to load ledger:', e);
        }
      };

      const loadConfig = async () => {
        try {
          const res = await fetch('/api/agent-config');
          const data = await res.json();
          if (data.undo_window_minutes) {
            setUndoWindow(Number(data.undo_window_minutes));
          }
        } catch (e) {
          console.error('Failed to load config:', e);
        }
      };

      const saveConfig = async (val) => {
        setUndoWindow(val);
        try {
          await fetch('/api/agent-config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: 'undo_window_minutes', value: String(val) })
          });
        } catch (e) {
          console.error('Failed to save config:', e);
        }
      };

      // WebSocket Connection
      const connectWS = useCallback(() => {
        if (wsRef.current) {
          wsRef.current.close();
        }

        console.error('[WS] Connecting to:', wsUrl);
        const ws = new WebSocket(wsUrl);
        wsRef.current = ws;

        ws.onopen = () => {
          console.error('[WS] Connected successfully');
          setWsConnected(true);
        };

        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'agent_event') {
              const ev = msg.data;
              setFeed(prev => [ev, ...prev].slice(0, 100));
            } else if (msg.type === 'replay') {
              const logs = msg.data;
              const events = logs.map(l => ({
                id: l.id,
                agentId: l.agentId,
                level: l.outcome === 'failed' ? 'error' : 'info',
                message: formatLog(l),
                ts: l.createdAt
              }));
              setFeed(events.reverse());
            } else if (msg.type === 'review_ack') {
              const { id } = msg.data;
              setReviewQueue(prev => prev.filter(item => item.id !== id));
              loadLedger();
            } else if (msg.type === 'undo_ack') {
              const { id } = msg.data;
              setLedger(prev => prev.map(item => item.id === id ? { ...item, outcome: 'undone' } : item));
            }
          } catch (err) {
            console.error('[WS] Message parsing error:', err);
          }
        };

        ws.onclose = () => {
          console.error('[WS] Disconnected');
          setWsConnected(false);
          if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
          reconnectTimerRef.current = setTimeout(() => {
            connectWS();
          }, 3000);
        };

        ws.onerror = (err) => {
          console.error('[WS] Error:', err);
          ws.close();
        };
      }, [wsUrl]);

      // Actions
      const handleReviewAction = (id, action) => {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({ type: 'review_action', id, action: action === 'approve' ? 'approved' : 'rejected' }));
        } else {
          // REST Fallback
          console.error('[WS] WS inactive, fallback to REST post');
          fetch(`/api/review/${id}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: action === 'approve' ? 'approved' : 'rejected' })
          })
          .then(res => res.json())
          .then(() => {
            setReviewQueue(prev => prev.filter(item => item.id !== id));
            loadLedger();
          })
          .catch(e => console.error('[REST] Review action fallback error:', e));
        }
      };

      const handleUndoLedger = async (id) => {
        try {
          const res = await fetch(`/api/ledger/${id}/undo`, { method: 'POST' });
          const data = await res.json();
          if (data.success) {
            setLedger(prev => prev.map(item => item.id === id ? { ...item, outcome: 'undone' } : item));
            setSuccessMsg('Ledger action successfully rolled back.');
            setTimeout(() => setSuccessMsg(''), 4000);
          } else {
            setErrorMsg(data.error || 'Failed to rollback ledger action.');
            setTimeout(() => setErrorMsg(''), 4000);
          }
        } catch (e) {
          console.error('Ledger undo error:', e);
          setErrorMsg('Failed to trigger undo action.');
          setTimeout(() => setErrorMsg(''), 4000);
        }
      };

      // Trigger standard RetailOps analysis workflow
      const triggerWorkflow = async (searchQuery) => {
        const query = searchQuery || productInput;
        if (!query.trim()) {
          setErrorMsg('Enter a query or click a preset.');
          return;
        }

        setErrorMsg('');
        setSuccessMsg('');
        setLoading(true);
        setStatusStep(1);

        const t1 = setTimeout(() => setStatusStep(2), 1200);
        const t2 = setTimeout(() => setStatusStep(3), 2400);
        const t3 = setTimeout(() => setStatusStep(4), 3600);

        try {
          const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_name: query, days_ahead: daysAhead })
          });
          const data = await res.json();
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
          setStatusStep(5);

          if (data.errors && data.errors.length > 0 && data.status !== 'completed') {
            setErrorMsg(`Workflow issue: ${data.errors.join('; ')}`);
          } else {
            setSuccessMsg(`Workflow analysis for "${query}" successful.`);
            loadLedger();
            loadReviewQueue();
          }
        } catch (e) {
          setErrorMsg(`Workflow trigger error: ${e.message}`);
        } finally {
          setLoading(false);
          setTimeout(() => setStatusStep(0), 2500);
        }
      };

      const clearLogCache = async () => {
        if (!confirm('Clear all cached analysis runs? This is irreversible.')) return;
        try {
          await fetch('/api/runs', { method: 'DELETE' });
          setSuccessMsg('All analysis logs cleared.');
          loadLedger();
        } catch (e) {
          setErrorMsg('Failed to clear logs.');
        }
      };

      // Lifecycle hooks
      useEffect(() => {
        connectWS();
        loadReviewQueue();
        loadLedger();
        loadConfig();

        return () => {
          if (wsRef.current) wsRef.current.close();
          if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
        };
      }, [connectWS]);

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col font-sans select-none selection:bg-phosphor selection:text-slate-950">
          
          {/* Header */}
          <header className="border-b border-slate-900 bg-slate-900/60 backdrop-blur-md px-6 py-4 sticky top-0 z-30 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="relative flex h-3 w-3">
                <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${wsConnected ? 'bg-emerald-400' : 'bg-amber-500'}`}></span>
                <span className={`relative inline-flex rounded-full h-3 w-3 ${wsConnected ? 'bg-emerald-500' : 'bg-amber-600'}`}></span>
              </div>
              <span className="font-display font-bold text-lg tracking-tight text-white">Retail<span className="text-phosphor">Ops</span></span>
              <span className="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">Action Console v2.0</span>
            </div>

            {/* WS Status Banner */}
            <div className="flex items-center space-x-4">
              <span className="hidden md:inline-flex items-center text-xs font-mono text-slate-400">
                WebSocket Status: &nbsp;
                <span className={wsConnected ? 'text-emerald-400 font-semibold' : 'text-amber-500 font-semibold'}>
                  {wsConnected ? 'CONNECTED' : 'RECONNECTING...'}
                </span>
              </span>

              <button onClick={() => { loadLedger(); loadReviewQueue(); }} className="p-2 text-slate-400 hover:text-white bg-slate-900 border border-slate-800 rounded-md hover:border-slate-700 transition">
                <Icon name="sync" />
              </button>

              <button onClick={clearLogCache} className="p-2 text-red-400 hover:text-red-300 bg-red-950/20 border border-red-900/30 rounded-md hover:border-red-900/60 transition" title="Clear analysis cache">
                <Icon name="trash" />
              </button>
            </div>
          </header>

          {/* Main Layout Grid */}
          <div className="flex-1 grid grid-cols-1 xl:grid-cols-4 gap-6 p-6">
            
            {/* Left Column: Sidebar Controls & Settings */}
            <div className="xl:col-span-1 flex flex-col space-y-6">
              
              {/* Settings Panel */}
              <div className="bg-slate-900/60 border border-slate-900 rounded-xl p-5 backdrop-blur-sm space-y-4">
                <div className="flex items-center space-x-2 text-slate-300 border-b border-slate-800 pb-2 mb-1">
                  <Icon name="settings" className="w-5 h-5 text-phosphor" />
                  <span className="font-display font-semibold text-sm tracking-wide text-white">SETTINGS PANEL</span>
                </div>

                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-mono text-slate-400">UNDO WINDOW</label>
                    <span className="text-xs font-mono text-phosphor font-bold">{undoWindow} minutes</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="30"
                    value={undoWindow}
                    onChange={(e) => saveConfig(Number(e.target.value))}
                    className="w-full accent-phosphor h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] font-mono text-slate-500">
                    <span>1m</span>
                    <span>15m</span>
                    <span>30m</span>
                  </div>
                </div>
              </div>

              {/* Workflow Orchestration */}
              <div className="bg-slate-900/60 border border-slate-900 rounded-xl p-5 backdrop-blur-sm space-y-4">
                <div className="flex items-center space-x-2 text-slate-300 border-b border-slate-800 pb-2 mb-1">
                  <Icon name="terminal" className="w-5 h-5 text-phosphor" />
                  <span className="font-display font-semibold text-sm tracking-wide text-white">ORCHESTRATOR PATH</span>
                </div>

                {/* Quick Presets */}
                <div className="space-y-2">
                  <label className="text-[10px] font-mono text-slate-400 block uppercase tracking-wider">Presets</label>
                  <div className="flex flex-wrap gap-1.5">
                    {['Smart TV', 'Pro Laptop', 'Groceries', 'Winter Coat', 'Headphones'].map((name) => (
                      <button
                        key={name}
                        onClick={() => {
                          const query = name === 'Smart TV' ? 'Sony 65-inch Bravia OLED 4K Smart TV'
                                      : name === 'Pro Laptop' ? 'Apple MacBook Pro 16 M3 Max Slate'
                                      : name === 'Groceries' ? 'Fresh Organic Pink Lady Apples'
                                      : name === 'Winter Coat' ? 'Designer Waterproof Wool Trench Coat'
                                      : 'Bose QuietComfort Wireless Headphones';
                          setProductInput(query);
                          triggerWorkflow(query);
                        }}
                        disabled={loading}
                        className="text-[11px] font-mono px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 hover:text-white transition disabled:opacity-50"
                      >
                        {name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Custom input */}
                <div className="space-y-2">
                  <label className="text-[10px] font-mono text-slate-400 block uppercase tracking-wider">Product Name</label>
                  <input
                    type="text"
                    value={productInput}
                    onChange={(e) => setProductInput(e.target.value)}
                    placeholder="Enter query to analyze..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-phosphor/50 transition font-mono"
                  />
                </div>

                {/* Forecast Horizon */}
                <div className="space-y-2">
                  <div className="flex justify-between">
                    <label className="text-[10px] font-mono text-slate-400 uppercase tracking-wider">Horizon</label>
                    <span className="text-xs font-mono text-slate-300">{daysAhead} days</span>
                  </div>
                  <input
                    type="range"
                    min="10"
                    max="90"
                    step="5"
                    value={daysAhead}
                    onChange={(e) => setDaysAhead(Number(e.target.value))}
                    className="w-full accent-phosphor h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer"
                  />
                </div>

                <button
                  onClick={() => triggerWorkflow()}
                  disabled={loading || !productInput.trim()}
                  className="w-full bg-phosphor hover:bg-phosphor-hover text-slate-950 font-semibold text-xs py-2.5 rounded-md flex items-center justify-center space-x-2 transition active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed"
                >
                  {loading ? <Icon name="spinner" /> : <Icon name="play" className="w-3.5 h-3.5" />}
                  <span>RUN PIPELINE</span>
                </button>

                {/* Pipeline Steps Tracker */}
                {(loading || statusStep > 0) && (
                  <div className="border border-slate-800 bg-slate-950/60 rounded-lg p-3 space-y-2 text-xs font-mono">
                    <div className="text-[10px] text-slate-500 uppercase pb-1 border-b border-slate-800">PIPELINE MONITOR</div>
                    {[
                      { step: 1, label: 'Enricher' },
                      { step: 2, label: 'Forecasting' },
                      { step: 3, label: 'Replenishment' },
                      { step: 4, label: 'Pricing' }
                    ].map(s => {
                      const active = statusStep === s.step;
                      const done = statusStep > s.step;
                      return (
                        <div key={s.step} className="flex items-center justify-between">
                          <span className={active ? 'text-phosphor' : done ? 'text-slate-400' : 'text-slate-600'}>
                            {s.step}. {s.label}
                          </span>
                          <span>
                            {done ? <span className="text-emerald-500">✔</span> : active ? <span className="text-phosphor animate-pulse">●</span> : <span className="text-slate-700">○</span>}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>

            {/* Right Columns: The 3 Panels */}
            <div className="xl:col-span-3 grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              {/* PANEL A: Agent Activity Feed */}
              <div className="bg-slate-900/40 border border-slate-900 rounded-xl p-5 flex flex-col h-[650px] lg:h-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                  <div className="flex items-center space-x-2">
                    <span className="w-2 h-2 rounded-full bg-phosphor shadow-[0_0_8px_#00ff66]"></span>
                    <span className="font-display font-semibold text-sm text-white uppercase tracking-wider">Panel A: Activity Feed</span>
                  </div>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">WS Connected</span>
                </div>

                {/* Event stream */}
                <div className="flex-1 overflow-y-auto space-y-2 pr-1 font-mono text-xs">
                  {feed.length === 0 ? (
                    <div className="text-slate-600 h-full flex items-center justify-center text-center p-6">
                      No logs recorded. Events appear here in real time as the agent process runs.
                    </div>
                  ) : (
                    feed.map((ev, index) => {
                      const colorClass = agentColors[ev.agentId] || 'text-slate-300 border-slate-800 bg-slate-950/20';
                      return (
                        <div key={ev.id || index} className={`p-2.5 rounded border ${colorClass} transition hover:bg-slate-800/10`}>
                          <div className="flex justify-between items-center text-[10px] opacity-75 mb-1.5">
                            <span className="font-bold uppercase tracking-wider">{ev.agentId}</span>
                            <span>{new Date(ev.ts || Date.now()).toLocaleTimeString()}</span>
                          </div>
                          <div className="text-slate-200 break-words leading-relaxed font-sans">{ev.message}</div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>

              {/* PANEL B: Review Queue */}
              <div className="bg-slate-900/40 border border-slate-900 rounded-xl p-5 flex flex-col h-[650px] lg:h-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                  <div className="flex items-center space-x-2">
                    <span className="w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.7)]"></span>
                    <span className="font-display font-semibold text-sm text-white uppercase tracking-wider">Panel B: Review Queue</span>
                  </div>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-yellow-950/20 border border-yellow-900/30 text-yellow-400">{reviewQueue.length} pending</span>
                </div>

                {/* Review Queue Items */}
                <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                  {reviewQueue.length === 0 ? (
                    <div className="text-slate-600 h-full flex items-center justify-center text-center p-6 font-mono text-xs">
                      All caught up: no pending review approvals.
                    </div>
                  ) : (
                    reviewQueue.map((item) => {
                      const pl = typeof item.payload === 'string' ? JSON.parse(item.payload) : item.payload;
                      const isPrice = item.type === 'price_update';
                      return (
                        <div key={item.id} className="bg-slate-950 border border-slate-800/80 rounded-lg p-4 space-y-3 transition hover:border-slate-800">
                          <div className="flex justify-between items-start">
                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded border uppercase font-semibold ${isPrice ? 'bg-emerald-950/20 border-emerald-900/50 text-emerald-400' : 'bg-blue-950/20 border-blue-900/50 text-blue-400'}`}>
                              {item.type}
                            </span>
                            <span className="text-[9px] font-mono text-slate-500">
                              {new Date(item.createdAt).toLocaleTimeString()}
                            </span>
                          </div>

                          <div className="space-y-1 text-xs">
                            <div className="font-semibold text-slate-200 text-sm">
                              {pl.productName || pl.category || 'Unknown Product'}
                            </div>
                            <div className="text-[11px] font-mono text-slate-400 flex flex-wrap gap-x-2 gap-y-0.5">
                              <span>Cat: <span className="text-slate-300">{pl.category || 'N/A'}</span></span>
                              {isPrice ? (
                                <>
                                  <span>Old: <span className="text-slate-300">Rs.{pl.oldPrice}</span></span>
                                  <span>New: <span className="text-emerald-400 font-semibold">Rs.{Number(pl.newPrice).toFixed(0)}</span></span>
                                  <span>Delta: <span className={pl.delta > 0 ? 'text-emerald-500' : 'text-red-500'}>{(pl.delta * 100).toFixed(1)}%</span></span>
                                </>
                              ) : (
                                <>
                                  <span>Qty: <span className="text-yellow-400 font-semibold">{pl.qty} units</span></span>
                                  <span>Supplier: <span className="text-slate-300">{pl.supplierName || 'Unknown'}</span></span>
                                </>
                              )}
                            </div>
                          </div>

                          <div className="flex space-x-2 pt-1.5">
                            <button
                              onClick={() => handleReviewAction(item.id, 'approve')}
                              className="flex-1 bg-emerald-600/20 hover:bg-emerald-600 hover:text-slate-950 border border-emerald-500/30 text-emerald-400 py-1.5 text-xs rounded transition flex items-center justify-center space-x-1 font-mono font-medium"
                            >
                              <Icon name="check" className="w-3.5 h-3.5" />
                              <span>APPROVE</span>
                            </button>
                            <button
                              onClick={() => handleReviewAction(item.id, 'reject')}
                              className="flex-1 bg-red-600/10 hover:bg-red-600 hover:text-white border border-red-500/20 text-red-400 py-1.5 text-xs rounded transition flex items-center justify-center space-x-1 font-mono font-medium"
                            >
                              <Icon name="ban" className="w-3.5 h-3.5" />
                              <span>REJECT</span>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>

              {/* PANEL C: Action Ledger */}
              <div className="bg-slate-900/40 border border-slate-900 rounded-xl p-5 flex flex-col h-[650px] lg:h-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                  <div className="flex items-center space-x-2">
                    <span className="w-2 h-2 rounded-full bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.7)]"></span>
                    <span className="font-display font-semibold text-sm text-white uppercase tracking-wider">Panel C: Action Ledger</span>
                  </div>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-950/20 border border-cyan-900/30 text-cyan-400">{ledger.length} entries</span>
                </div>

                {/* Ledger items */}
                <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                  {ledger.length === 0 ? (
                    <div className="text-slate-600 h-full flex items-center justify-center text-center p-6 font-mono text-xs">
                      No actions recorded in ledger yet.
                    </div>
                  ) : (
                    ledger.map((item) => {
                      const pl = typeof item.payload === 'string' ? JSON.parse(item.payload) : item.payload;
                      const isUndone = item.outcome === 'undone';
                      return (
                        <div key={item.id} className={`bg-slate-950 border border-slate-800/80 rounded-lg p-3.5 space-y-2 transition hover:border-slate-800 ${isUndone ? 'opacity-50' : ''}`}>
                          <div className="flex justify-between items-center">
                            <div className="flex items-center space-x-2">
                              <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded uppercase font-semibold text-slate-300 border border-slate-800 bg-slate-900`}>
                                {item.agentId}
                              </span>
                              <span className="text-[10px] font-mono text-slate-400 font-medium">{item.actionType}</span>
                            </div>
                            <span className={`text-[9px] font-mono px-1.5 rounded uppercase font-bold ${isUndone ? 'bg-slate-800 text-slate-500 border border-slate-700' : 'bg-emerald-950/20 text-emerald-400 border border-emerald-900/40'}`}>
                              {item.outcome}
                            </span>
                          </div>

                          <div className="text-xs text-slate-300">
                            {formatLog(item)}
                          </div>

                          <div className="flex items-center justify-between pt-1 border-t border-slate-900 text-[10px] font-mono text-slate-500">
                            <span>{new Date(item.createdAt).toLocaleTimeString()}</span>
                            {!isUndone && (item.actionType === 'price_update' || item.actionType === 'purchase_order') && (
                              <button
                                onClick={() => handleUndoLedger(item.id)}
                                className="text-red-400 hover:text-red-300 border border-red-900/30 hover:border-red-800 bg-red-950/10 px-2.5 py-1 rounded transition flex items-center space-x-1"
                              >
                                <Icon name="undo" className="w-3 h-3" />
                                <span>UNDO</span>
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>

            </div>
          </div>

          {/* User notification status bar */}
          {(errorMsg || successMsg) && (
            <div className="fixed bottom-6 right-6 z-50 animate-bounce">
              {errorMsg && (
                <div className="bg-red-950 border border-red-800 text-red-200 px-4 py-3 rounded-lg flex items-center space-x-2 shadow-2xl text-sm font-mono">
                  <Icon name="ban" className="text-red-400" />
                  <span>{errorMsg}</span>
                </div>
              )}
              {successMsg && (
                <div className="bg-emerald-950 border border-emerald-800 text-emerald-200 px-4 py-3 rounded-lg flex items-center space-x-2 shadow-2xl text-sm font-mono">
                  <Icon name="check" className="text-emerald-400" />
                  <span>{successMsg}</span>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
